name: Tests

# A focused gate that runs the Jest suite — including the preview↔delivery
# email-render parity guardrail (makeResponsiveHtml.parity.spec.ts). Kept
# separate from ci.yaml (eslint / prettier / tsc) on purpose: those checks
# carry pre-existing debt from the upstream fork and would block this gate
# before it ever reached the tests. This workflow is the merge gate for the
# behavior we care about; style/type cleanup can green ci.yaml later.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      # No root workspaces: each package carries its own lockfile. Install the
      # root deps, then every package's deps. Looping keeps this in sync as
      # packages are added or removed (the old hand-written list missed two).
      - run: npm ci
      - name: Install per-package dependencies
        run: |
          for dir in packages/*/; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "::group::npm ci — $dir"
              (cd "$dir" && npm ci)
              echo "::endgroup::"
            fi
          done
      - run: npm test
